[project]
name = "mrEngravingSeg"
version = "1.0.1"
description = "Meshroom plugin for tiled engraving segmentation."
requires-python = ">=3.10,<3.12"
dependencies = [
    "Pillow==10.4.0",
    "gdown>=5.2,<6",
    "tensorflow==2.13.1",
]

[tool.uv]
package = false

[tool.meshroom]
publisher = "meshroomHub"
requirements = "Python 3.10 or 3.11; TensorFlow 2.13.1."
